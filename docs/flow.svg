<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1170" viewBox="0 0 1100 1170" font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5160"/>
    </marker>
    <style>
      .title  { font-size: 14px; font-weight: 700; fill: #1b1e23; }
      .line   { font-size: 13px; fill: #2b2f36; }
      .small  { font-size: 11.5px; fill: #5b6170; }
      .tag    { font-size: 11px; font-weight: 700; }
      .sec    { font-size: 16px; font-weight: 700; fill: #1b1e23; }
      .secsub { font-size: 12px; fill: #5b6170; }
      .ln     { stroke: #4a5160; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash   { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1100" height="1170" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#1b1e23">Cloud CLI Builder の処理の流れ</text>
  <rect x="30" y="58" width="14" height="14" rx="3" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="50" y="70" class="small">ブラウザ</text>
  <rect x="122.0" y="58" width="14" height="14" rx="3" fill="#f2f9f4" stroke="#3a8a55" stroke-width="1.4"/>
  <text x="142.0" y="70" class="small">サーバー</text>
  <rect x="214.0" y="58" width="14" height="14" rx="3" fill="#fdf7ec" stroke="#b07a1f" stroke-width="1.4"/>
  <text x="234.0" y="70" class="small">データ・辞書</text>
  <rect x="329.0" y="58" width="14" height="14" rx="3" fill="#f6f2fd" stroke="#7a5bc0" stroke-width="1.4"/>
  <text x="349.0" y="70" class="small">Claude Code</text>
  <text x="30" y="115" class="sec">A. 起動と画面を開く</text>
  <line x1="30" y1="124" x2="1070" y2="124" stroke="#d5d9e0"/>
  <rect x="30" y="135" width="233" height="128" rx="8" fill="#f2f9f4" stroke="#3a8a55" stroke-width="1.4"/>
  <text x="44" y="153" class="tag" fill="#3a8a55">サーバー</text>
  <text x="44" y="173" class="title">① サーバーを起動する</text>
  <text x="44" y="193" class="line">botocore の定義から全コマンド</text>
  <text x="44" y="211" class="line">の一覧と検索用データを作る</text>
  <text x="44" y="229" class="line">お気に入りの保存先を用意する</text>
  <text x="44" y="252" class="small">aws_catalog.py, favorites.py</text>
  <rect x="299" y="135" width="233" height="128" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="313" y="153" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="313" y="173" class="title">② 画面を開く</text>
  <text x="313" y="193" class="line">検索用の日本語辞書、画面の訳、</text>
  <text x="313" y="211" class="line">Claude 連携の状態を受け取る</text>
  <text x="313" y="252" class="small">GET /</text>
  <rect x="568" y="135" width="233" height="128" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="582" y="153" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="582" y="173" class="title">③ 前回の設定を読み込む</text>
  <text x="582" y="193" class="line">テーマ、シェルの形式、</text>
  <text x="582" y="211" class="line">--region などの共通オプション</text>
  <text x="582" y="252" class="small">ブラウザの localStorage</text>
  <rect x="837" y="135" width="233" height="128" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="851" y="153" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="851" y="173" class="title">④ 一覧を表示する</text>
  <text x="851" y="193" class="line">サービス一覧とお気に入りを表示</text>
  <text x="851" y="211" class="line">URL にコマンドがあれば開く</text>
  <text x="851" y="252" class="small">GET /api/aws/services など</text>
  <path class="ln" d="M263,199.0 H297"/>
  <path class="ln" d="M532,199.0 H566"/>
  <path class="ln" d="M801,199.0 H835"/>
  <text x="30" y="310" class="sec">B. コマンドを組み立てる</text>
  <text x="230" y="310" class="secsub">Claude は使わない</text>
  <line x1="30" y1="319" x2="1070" y2="319" stroke="#d5d9e0"/>
  <rect x="30" y="330" width="233" height="105" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="44" y="348" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="44" y="368" class="title">① コマンドを探す</text>
  <text x="44" y="388" class="line">一覧から選ぶ、または検索する</text>
  <text x="44" y="424" class="small">GET /api/aws/search など</text>
  <rect x="30" y="455" width="233" height="105" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="44" y="473" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="44" y="493" class="title">① または、貼り付ける</text>
  <text x="44" y="513" class="line">aws … の文字列を読み取るだけ</text>
  <text x="44" y="531" class="line">（実行はしない）</text>
  <text x="44" y="549" class="small">paste.js</text>
  <rect x="299" y="382.5" width="233" height="125" rx="8" fill="#f2f9f4" stroke="#3a8a55" stroke-width="1.4"/>
  <text x="313" y="400.5" class="tag" fill="#3a8a55">サーバー</text>
  <text x="313" y="420.5" class="title">② コマンドの詳細を返す</text>
  <text x="313" y="440.5" class="line">オプションの一覧、型、必須か</text>
  <text x="313" y="458.5" class="line">どうか、公式リファレンスの</text>
  <text x="313" y="476.5" class="line">URL を返す</text>
  <text x="313" y="496.5" class="small">GET /api/aws/command</text>
  <rect x="568" y="382.5" width="233" height="125" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="582" y="400.5" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="582" y="420.5" class="title">③ コマンドを組み立てる</text>
  <text x="582" y="440.5" class="line">入力に合わせて自動で作る</text>
  <text x="582" y="458.5" class="line">シェルの形式に合わせて整形</text>
  <text x="582" y="476.5" class="line">危険な操作は色で警告</text>
  <text x="582" y="496.5" class="small">app.js</text>
  <rect x="837" y="330" width="233" height="105" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="851" y="348" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="851" y="368" class="title">④ コピーする</text>
  <text x="851" y="388" class="line">履歴をブラウザに残す（30件）</text>
  <text x="851" y="424" class="small">localStorage</text>
  <rect x="837" y="455" width="233" height="105" rx="8" fill="#f2f9f4" stroke="#3a8a55" stroke-width="1.4"/>
  <text x="851" y="473" class="tag" fill="#3a8a55">サーバー</text>
  <text x="851" y="493" class="title">④ または、お気に入りに保存</text>
  <text x="851" y="513" class="line">追加・編集・削除・JSON 入出力</text>
  <text x="851" y="549" class="small">SQLite (/data/favorites.db)</text>
  <path class="ln" d="M263,382.5 C285,382.5 275,445.0 297,445.0"/>
  <path class="ln" d="M263,507.5 C285,507.5 275,445.0 297,445.0"/>
  <path class="ln" d="M532,445.0 H566"/>
  <path class="ln" d="M801,445.0 C815,445.0 815,382.5 835,382.5"/>
  <path class="ln" d="M801,445.0 C815,445.0 815,507.5 835,507.5"/>
  <text x="30" y="605" class="sec">C. Claude で日本語化</text>
  <text x="215" y="605" class="secsub">ボタンを押したときだけ</text>
  <line x1="30" y1="614" x2="1070" y2="614" stroke="#d5d9e0"/>
  <rect x="30" y="625" width="233" height="125" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="44" y="643" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="44" y="663" class="title">① 日本語化ボタンを押す</text>
  <text x="44" y="683" class="line">訳す範囲を選ぶ</text>
  <text x="44" y="701" class="line">（すべて／必須と入力済み／</text>
  <text x="44" y="719" class="line">辞書だけ）</text>
  <rect x="299" y="625" width="233" height="125" rx="8" fill="#f2f9f4" stroke="#3a8a55" stroke-width="1.4"/>
  <text x="313" y="643" class="tag" fill="#3a8a55">サーバー</text>
  <text x="313" y="663" class="title">② 使えるか確認する</text>
  <text x="313" y="683" class="line">Claude 連携が未設定なら中止</text>
  <text x="313" y="701" class="line">Claude の API につながるか</text>
  <text x="313" y="719" class="line">を数秒で確認</text>
  <text x="313" y="739" class="small">POST /api/claude/localize</text>
  <rect x="568" y="625" width="233" height="125" rx="8" fill="#fdf7ec" stroke="#b07a1f" stroke-width="1.4"/>
  <text x="582" y="643" class="tag" fill="#b07a1f">データ・辞書</text>
  <text x="582" y="663" class="title">③ まず辞書で訳す</text>
  <text x="582" y="683" class="line">説明文を文に分け、手書きの</text>
  <text x="582" y="701" class="line">辞書・学習辞書・決まった形の</text>
  <text x="582" y="719" class="line">文のパターンで訳す</text>
  <text x="582" y="739" class="small">ja_docs.json, ja_learned.json</text>
  <rect x="837" y="625" width="233" height="125" rx="8" fill="#f6f2fd" stroke="#7a5bc0" stroke-width="1.4"/>
  <text x="851" y="643" class="tag" fill="#7a5bc0">Claude Code</text>
  <text x="851" y="663" class="title">④ 残りを Claude で訳す</text>
  <text x="851" y="683" class="line">辞書にない文だけを送る</text>
  <text x="851" y="701" class="line">20文ずつ、最大4つ同時に実行</text>
  <text x="851" y="719" class="line">ツールは一切使えない</text>
  <text x="851" y="739" class="small">claude -p --tools &quot;&quot;</text>
  <path class="ln" d="M263,687.5 H297"/>
  <path class="ln" d="M532,687.5 H566"/>
  <path class="ln" d="M801,687.5 H835"/>
  <rect x="837" y="815" width="233" height="110" rx="8" fill="#fdf7ec" stroke="#b07a1f" stroke-width="1.4"/>
  <text x="851" y="833" class="tag" fill="#b07a1f">データ・辞書</text>
  <text x="851" y="853" class="title">⑤ 訳を学習辞書に保存</text>
  <text x="851" y="873" class="line">次からは同じ文に</text>
  <text x="851" y="891" class="line">Claude を使わない</text>
  <text x="851" y="914" class="small">/data/ja_learned.json</text>
  <rect x="568" y="815" width="233" height="110" rx="8" fill="#f2f9f4" stroke="#3a8a55" stroke-width="1.4"/>
  <text x="582" y="833" class="tag" fill="#3a8a55">サーバー</text>
  <text x="582" y="853" class="title">⑥ 訳をまとめて返す</text>
  <text x="582" y="873" class="line">辞書と Claude の訳を合わせる</text>
  <text x="582" y="891" class="line">訳せなかった文は英語のまま</text>
  <rect x="30" y="815" width="502" height="110" rx="8" fill="#f3f7fc" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="44" y="833" class="tag" fill="#3b6ea8">ブラウザ</text>
  <text x="44" y="853" class="title">⑦ 画面に日本語を重ねて表示</text>
  <text x="44" y="873" class="line">「原文」で英語も見られる。ボタンなどの画面の文言も日本語になる</text>
  <text x="44" y="891" class="line">別のコマンドに移ると英語に戻る（訳は画面にだけ保持）</text>
  <path class="ln" d="M953.5,750 V813"/>
  <path class="ln" d="M837,870.0 H803"/>
  <path class="ln" d="M568,870.0 H534"/>
  <path class="ln dash" d="M684.5,750 V813"/>
  <text x="692.5" y="786" class="small">辞書だけで訳せた文</text>
  <text x="30" y="980" class="sec">共通の仕組み</text>
  <text x="138" y="980" class="secsub">サーバーの入口で、すべてのリクエストに対して行う</text>
  <line x1="30" y1="989" x2="1070" y2="989" stroke="#d5d9e0"/>
  <rect x="30" y="1000" width="1040" height="115" rx="8" fill="#f2f9f4" stroke="#3a8a55" stroke-width="1.4"/>
  <text x="44" y="1018" class="tag" fill="#3a8a55">サーバー</text>
  <text x="44" y="1038" class="title">リクエストを確認する</text>
  <text x="44" y="1058" class="line">開いてよいホスト名からのリクエストか確認する（ほかのサイトからの悪用を防ぐ）</text>
  <text x="44" y="1076" class="line">保存・削除・日本語化などの書き込みは、画面の JS が付ける専用ヘッダー（X-CCB）付きで、同じオリジンからのものだけ受け付ける</text>
  <text x="44" y="1104" class="small">main.py（/healthz は Docker のヘルスチェック用）</text>
  <text x="30" y="1150" class="small">このツールは AWS のコマンドを実行せず、AWS の認証情報も扱いません。</text>
</svg>
